@if (countries.length > 0) {
    <ul
        class="list-none p-2 mt-1 absolute bg-white border border-gray-300 rounded-md shadow-md z-10 w-full"
    >
        @for (row of countries; track row) {
            <li class="w-full">
                <button type="button" (click)="sendData(row.name.common)" class="w-full text-left p-2 hover:bg-gray-200 focus:bg-gray-200">
                    {{ row.name.common }}
                </button>
            </li>
        }
    </ul>
}

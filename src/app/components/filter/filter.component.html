<form [formGroup]="form" class="grid grid-cols-1 gap-4 mb-5 md:grid-cols-2">
    <section class="border border-gray-300 rounded-md relative">
        <input
            type="text"
            placeholder="search country"
            formControlName="maskCountry"
            class="w-full p-2 outline-none"
        />
        @if (form.get('country')?.valid) {
            <eg-debounce [name]="form.get('country')?.value" (countrySelect)="setCountry($event)" />
        }
    </section>

    <select formControlName="region" class="border border-gray-300 rounded-md p-2 outline-none">
        <option [value]=""></option>
        @for (row of store.listRegions(); track $index) {
            <option [value]="row">{{ row }}</option>
        }
    </select>
</form>
